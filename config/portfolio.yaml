event_driven:
  enabled: true

  morning_batch_time: "06:30"       # CST
  intraday_check_times: ["11:00", "13:00", "15:00"]  # CST
  evening_batch_time: "17:30"       # CST

  intraday_severity_threshold: 3    # only severity-3 triggers intraday predictions
  watchlist_severity_threshold: 3   # only severity-3 promotes watchlist ticker

  scheduled_cadence:
    horizon_5d:   "weekly_monday"
    horizon_21d:  "weekly_monday"
    horizon_63d:  "monthly_first_trading_day"
    horizon_250d: "quarterly_first_trading_day"

  detectors:
    earnings:        true
    sec_8k:          true
    rating_changes:  true
    material_news:   true
    macro_events:    true

